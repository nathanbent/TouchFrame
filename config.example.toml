[webhooks]
# Lets other systems put alerts on the screen. Needs listen = "0.0.0.0:8660" under [app].
token = ""                      # a long random string; "" = off
hold_seconds = 60               # how long an alert stays up unless it says
emergency_severities = ["disaster"]              # Grafana "severity" labels shown as emergencies
high_severities = ["critical", "high", "error"]  # and as high priority

[screensaver]
enabled = true
idle_minutes = 5                # photos start after this long untouched (0 = never)
folder = "~/Pictures/touchframe"   # subfolders are included
seconds = 30                    # per photo
picture_of_the_day = true       # add Wikimedia Commons' picture of the day
clock = true

[screen]
backlight = "auto"              # "off" leaves the backlight alone
brightness = 100                # percent
dim_hours = []                  # e.g. [22, 7] dims the screen from 22:00 to 07:00
dim_brightness = 10             # percent while dimmed
wake_seconds = 60               # full brightness this long after a touch or a text page
